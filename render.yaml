databases:
  - name: ecommerce_db
    databaseName: ecommerce_db
    user: ecommerce_user
    plan: free

services:
  - type: web
    name: django-ecommerce
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn EcommerceProject.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.11"
