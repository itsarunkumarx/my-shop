{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2>Checkout</h2>
    <hr>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <h4>Shipping Address</h4>

    <form method="POST" action="{% url 'place_order' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input
                type="text"
                name="phone"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea
                name="address"
                class="form-control"
                rows="3"
                required
            ></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">City</label>
            <input
                type="text"
                name="city"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">State</label>
            <input
                type="text"
                name="state"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Pincode</label>
            <input
                type="text"
                name="pincode"
                class="form-control"
                required
            >
        </div>

        <button type="submit" class="btn btn-success">
            Place Order
        </button>

        <a href="{% url 'cart' %}" class="btn btn-secondary">
            Back to Cart
        </a>

        <a href="{% url 'my_orders' %}" class="btn btn-primary">
            My Orders
        </a>

    </form>

</div>

{% endblock %}
