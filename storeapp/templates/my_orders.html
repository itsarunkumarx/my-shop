{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<h2>My Orders</h2>

<table class="table table-bordered">

<tr>

<th>Order ID</th>

<th>Total</th>

<th>Status</th>

<th>Date</th>

<th>Action</th>

</tr>

{% for order in orders %}

<tr>

<td>#{{ order.id }}</td>

<td>₹ {{ order.total_amount }}</td>

<td>{{ order.status }}</td>

<td>{{ order.created_at }}</td>

<td>

<a
href="{% url 'order_detail' order.id %}"

class="btn btn-info">

View

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
