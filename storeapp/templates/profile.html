{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body text-center">

            <h2>
                Welcome {{ request.user.username }}
            </h2>

            <p>
                Email:
                {{ request.user.email }}
            </p>

            <p>
                First Name:
                {{ request.user.first_name }}
            </p>

            <p>
                Last Name:
                {{ request.user.last_name }}
            </p>

            <a
                href="{% url 'logout' %}"
                class="btn btn-danger">

                Logout

            </a>

        </div>

    </div>

</div>

{% endblock %}
